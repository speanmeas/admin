name: speanmeas
description: "Hotel Management System."
# publish_to: "CloudFlare" # Remove this line if you wish to publish to pub.dev

version: 1.1.1+197

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.2.3
  flutter_typeahead: ^6.0.0
  hive: ^2.2.3
  image_picker: ^1.2.2
  intl: ^0.20.2
  json_annotation: ^4.12.0
  package_info_plus: ^10.0.0
  path_provider: ^2.1.4
  pluto_grid: ^8.1.0
  provider: ^6.1.5+1
  url_launcher: ^6.3.2

  # syncfusion_flutter_datagrid: ^33.1.49

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icon/

  fonts:
    - family: Nokora
      fonts:
        - asset: assets/font/Nokora.ttf
    - family: Siemreap
      fonts:
        - asset: assets/font/Siemreap.ttf
